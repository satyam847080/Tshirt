<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student T-Shirt Registration</title>
    <link rel="stylesheet" href="tshirt.css">
</head>start tshirt.html
<body>

    <div class="container">
        <div class="header">
            <h1>TSHIRT</h1>
            <p>Student T-Shirt Registration Portal</p>
        </div>

        <form id="studentForm">

            <h2>Student Details</h2>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Roll Number</label>
                <input type="text" id="roll" placeholder="Enter roll number" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter email" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="phone" placeholder="Enter mobile number" required>
            </div>

            <div class="form-group">
                <label>Department</label>
                <select id="department" required>
                    <option value="">Select Department</option>
                    <option value="CSE">Computer Science</option>
                    <option value="IT">Information Technology</option>
                    <option value="ECE">Electronics</option>
                    <option value="ME">Mechanical</option>
                    <option value="CE">Civil</option>
                </select>
            </div>

            <div class="form-group">
                <label>Select T-Shirt Size</label>
                <select id="size" required>
                    <option value="">Choose Size</option>
                    <option value="S">Small (S)</option>
                    <option value="M">Medium (M)</option>
                    <option value="L">Large (L)</option>
                    <option value="XL">Extra Large (XL)</option>
                    <option value="XXL">Double XL (XXL)</option>
                </select>
            </div>

            <button type="submit">Submit Registration</button>

        </form>

        <p id="message"></p>
    </div>

    <script src="tshirt.js"></script>
</body>
</html>
