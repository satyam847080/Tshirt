<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TSHIRT | Admin Dashboard</title>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0d0f10;
            color: white;
            padding: 30px;
        }

        .container {
            max-width: 1300px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #a855f7;
            font-size: 32px;
        }

        .header p {
            color: #aaa;
            margin-top: 7px;
        }

        .stats {
            background: #181b1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 22px;
            width: 220px;
            margin-bottom: 25px;
        }

        .stats h3 {
            color: #aaa;
            font-size: 15px;
        }

        .stats h2 {
            color: #a855f7;
            font-size: 32px;
            margin-top: 10px;
        }

        .table-container {
            background: #181b1e;
            padding: 25px;
            border: 1px solid #333;
            border-radius: 12px;
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .table-header h2 {
            font-size: 22px;
        }

        input {
            padding: 12px;
            width: 260px;
            background: #25292d;
            border: 1px solid #444;
            border-radius: 7px;
            color: white;
            outline: none;
        }

        button {
            padding: 12px 18px;
            background: #a855f7;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #9333ea;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }

        th {
            background: #25292d;
            color: #c084fc;
        }

        tr:hover {
            background: #25292d;
        }

        .size {
            background: #4c1d95;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
        }

        .delete-btn {
            background: #dc2626;
            padding: 8px 12px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        #message {
            color: #c084fc;
            margin-top: 15px;
        }

        @media(max-width: 600px) {
            body {
                padding: 15px;
            }

            .header h1 {
                font-size: 25px;
            }

            input {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>TSHIRT ADMIN</h1>
            <p>Student Registration Management Dashboard</p>
        </div>

        <button onclick="loadStudents()">Refresh Data</button>
    </div>

    <div class="stats">
        <h3>Total Registered Students</h3>
        <h2 id="totalStudents">0</h2>
    </div>

    <div class="table-container">

        <div class="table-header">
            <h2>Student Records</h2>

            <input
                type="text"
                id="search"
                placeholder="Search name or roll number..."
                oninput="displayStudents()"
            >

            <button onclick="exportExcel()">Download Excel</button>
        </div>

        <table id="studentTable">

            <thead>
                <tr>
                    <th>S.No.</th>
                    <th>Roll Number</th>
                    <th>Student Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Department</th>
                    <th>T-Shirt Size</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentData">
                <tr>
                    <td colspan="8">Loading students...</td>
                </tr>
            </tbody>

        </table>

        <p id="message"></p>

    </div>

</div>

<script>

    const API_URL = "http://localhost:5000/api/students";

    let students = [];

    // Fetch students from MongoDB

    async function loadStudents() {

        const tbody = document.getElementById("studentData");

        tbody.innerHTML = `
            <tr>
                <td colspan="8">Loading students...</td>
            </tr>
        `;

        try {

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Unable to fetch students");
            }

            students = await response.json();

            document.getElementById("totalStudents").innerText =
                students.length;

            displayStudents();

        } catch (error) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="8">Server connection failed!</td>
                </tr>
            `;

            console.log(error);

        }

    }

    // Display student data

    function displayStudents() {

        const tbody = document.getElementById("studentData");

        const search = document.getElementById("search")
            .value.toLowerCase();

        const filteredStudents = students.filter(student => {

            return (
                student.name.toLowerCase().includes(search) ||
                student.roll.toLowerCase().includes(search)
            );

        });

        if (filteredStudents.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="8">No students found!</td>
                </tr>
            `;

            return;
        }

        tbody.innerHTML = filteredStudents.map((student, index) => {

            return `
                <tr>
                    <td>${index + 1}</td>
                    <td>${escapeHTML(student.roll)}</td>
                    <td>${escapeHTML(student.name.trim())}</td>
                    <td>${escapeHTML(student.email)}</td>
                    <td>${escapeHTML(student.phone)}</td>
                    <td>${escapeHTML(student.department)}</td>
                    <td><span class="size">${escapeHTML(student.size)}</span></td>
                    <td>
                        <button class="delete-btn"
                            onclick="deleteStudent('${student._id}')">
                            Delete
                        </button>
                    </td>
                </tr>
            `;

        }).join("");

    }

    // Escape text before adding it to the table

    function escapeHTML(value) {

        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);

    }

    // Delete student

    async function deleteStudent(id) {

        const confirmDelete = confirm(
            "Are you sure you want to delete this student?"
        );

        if (!confirmDelete) return;

        try {

            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "Delete failed");
            }

            document.getElementById("message").innerText =
                "Student deleted successfully!";

            await loadStudents();

        } catch (error) {

            document.getElementById("message").innerText =
                error.message;

        }

    }

    // Export Excel

    function exportExcel() {

        if (typeof XLSX === "undefined") {
            alert("Excel library load nahi hui. Internet check karo.");
            return;
        }

        if (students.length === 0) {
            alert("No student data available!");
            return;
        }

        const excelData = students.map((student, index) => ({

            "S.No.": index + 1,
            "Roll Number": student.roll,
            "Student Name": student.name.trim(),
            "Email": student.email,
            "Mobile": student.phone,
            "Department": student.department,
            "T-Shirt Size": student.size

        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);

        const workbook = XLSX.utils.book_new();

        XLSX.utils.book_append_sheet(
            workbook,
            worksheet,
            "Students"
        );

        XLSX.writeFile(workbook, "Tshirt_Students.xlsx");

    }

    // Automatically load data

    loadStudents();

</script>

</body>
</html>
